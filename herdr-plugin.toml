# Earmark: closed agent sessions, filed under their Herdr workspace and
# ready to reopen. See README.md; CLAUDE.md has the design.

id = "io.github.cwilliams5.earmark"
name = "Earmark"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Closed agent sessions, filed under their Herdr workspace and ready to reopen."
platforms = ["linux", "macos"]

# Bound to a key in the user's Herdr config:
#   [[keys.command]]
#   key = "prefix+a"
#   type = "plugin_action"
#   command = "io.github.cwilliams5.earmark.open"
[[actions]]
id = "open"
title = "Open the archive"
description = "Show this workspace's archived agent sessions."
contexts = ["workspace"]
command = ["python3", "earmark.py", "open"]

# Bound to Shift+the same key: the popup opened on closed workspaces.
[[actions]]
id = "open-workspaces"
title = "Restore a closed workspace"
description = "Show closed workspaces, to bring one back with all its tabs."
contexts = ["workspace"]
command = ["python3", "earmark.py", "open-workspaces"]

[[panes]]
id = "archive"
title = "Earmark"
placement = "popup"
width = "80%"
height = "60%"
command = ["python3", "earmark.py", "popup"]

# Herdr's close events carry only ids, so every hook refreshes Earmark's
# notes on the live panes, and closes are found by comparing (earmark/core.py).
[[startup]]
command = ["python3", "earmark.py", "hook"]

[[events]]
on = "pane.closed"
command = ["python3", "earmark.py", "hook"]

[[events]]
on = "tab.closed"
command = ["python3", "earmark.py", "hook"]

[[events]]
on = "workspace.closed"
command = ["python3", "earmark.py", "hook"]

[[events]]
on = "pane.agent_detected"
command = ["python3", "earmark.py", "hook"]

[[events]]
on = "pane.agent_status_changed"
command = ["python3", "earmark.py", "hook"]

[[events]]
on = "pane.focused"
command = ["python3", "earmark.py", "hook"]

[[events]]
on = "workspace.renamed"
command = ["python3", "earmark.py", "hook"]

[[events]]
on = "tab.renamed"
command = ["python3", "earmark.py", "hook"]

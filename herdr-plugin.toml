# Earmark: closed agent sessions, filed under their Herdr workspace and
# ready to reopen. See README.md; CLAUDE.md has the design.

id = "io.github.cwilliams5.earmark"
name = "Earmark"
version = "1.2.0"
min_herdr_version = "0.9.5"
description = "Closed agent sessions, filed under their Herdr workspace and ready to reopen."
platforms = ["linux", "macos"]

# Bound to a key in the user's Herdr config:
#   [[keys.command]]
#   key = "prefix+a"
#   type = "plugin_action"
#   command = "io.github.cwilliams5.earmark.open"
[[actions]]
id = "open"
title = "Open the archive"
description = "Show this workspace's archived agent sessions."
contexts = ["workspace"]
command = ["python3", "earmark.py", "open"]

# Bound to Shift+the same key: the popup opened on closed workspaces.
[[actions]]
id = "open-workspaces"
title = "Restore a closed workspace"
description = "Show closed workspaces, to bring one back with all its tabs."
contexts = ["workspace"]
command = ["python3", "earmark.py", "open-workspaces"]

# Suspend the agent in view to free its memory, or resume it (Ctrl+S, say):
#   key = "prefix+ctrl+s", command = "io.github.cwilliams5.earmark.suspend"
[[actions]]
id = "suspend"
title = "Suspend or resume this tab"
description = "End the agent in view to free its memory, keeping the tab; or bring a suspended one back."
contexts = ["workspace"]
command = ["python3", "earmark.py", "suspend"]

[[actions]]
id = "note"
title = "This workspace's note"
description = "Read or edit this workspace's note, or ask a Claude session here to update it."
contexts = ["workspace"]
command = ["python3", "earmark.py", "note-open"]

[[panes]]
id = "note"
title = "Earmark"
placement = "popup"
width = "80%"
height = "70%"
command = ["python3", "earmark.py", "note-popup"]

[[panes]]
id = "archive"
title = "Earmark"
placement = "popup"
width = "90%"
height = "70%"
command = ["python3", "earmark.py", "popup"]

# The suspend key's answers and its "suspend anyway?" question: Herdr's own
# notifications are off unless [ui.toast] delivery is set, so they'd go unseen.
[[panes]]
id = "message"
title = "Earmark"
placement = "popup"
width = "60%"
height = "50%"
command = ["python3", "earmark.py", "message"]

# Herdr's close events carry only ids, so every hook refreshes Earmark's
# notes on the live panes, and closes are found by comparing (earmark/core.py).
[[startup]]
command = ["python3", "earmark.py", "hook"]

[[events]]
on = "pane.closed"
command = ["python3", "earmark.py", "hook"]

[[events]]
on = "tab.closed"
command = ["python3", "earmark.py", "hook"]

[[events]]
on = "workspace.closed"
command = ["python3", "earmark.py", "hook"]

[[events]]
on = "pane.agent_detected"
command = ["python3", "earmark.py", "hook"]

[[events]]
on = "pane.agent_status_changed"
command = ["python3", "earmark.py", "hook"]

[[events]]
on = "pane.focused"
command = ["python3", "earmark.py", "hook"]

[[events]]
on = "workspace.renamed"
command = ["python3", "earmark.py", "hook"]

[[events]]
on = "tab.renamed"
command = ["python3", "earmark.py", "hook"]
